# Entorno completo: PostgreSQL + API + frontend servido por nginx.
# Uso: copiar .env.example a .env, ajustar secretos y ejecutar `docker compose up --build`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asesor}
      POSTGRES_USER: ${POSTGRES_USER:-asesor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-asesor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-asesor}
      SANDBOX_URL: http://sandbox:8100
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_started

  # Solo construye la imagen de ejecución de pruebas del estudiante y termina.
  sandbox-imagen:
    build: ./sandbox/imagen
    image: asesor-sandbox-python:1
    entrypoint: ["true"]
    restart: "no"

  # ATENCION: el socket de Docker da poder sobre el host. Por eso este servicio NO publica puertos
  # (solo la red interna de compose), exige un token (SANDBOX_TOKEN) y solo sabe lanzar un comando
  # fijo (`docker run` con aislamiento: sin red, solo lectura, límites, usuario sin privilegios).
  sandbox:
    build: ./sandbox/servicio
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_IMAGEN: asesor-sandbox-python:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-imagen:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data:
  storage:
